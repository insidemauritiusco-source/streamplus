<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamPlus</title>
<style>
:root {
  --bg: #090711;
  --card: #1c1630;
  --purple: #9747ff;
  --muted: #c6bad8;
  --text: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  background: #130e22;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  color: #b77aff;
  font-size: 26px;
  font-weight: bold;
}
nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
  background: #130e22;
}
button {
  background: var(--purple);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  cursor: pointer;
}
nav button { white-space: nowrap; }
.catalog-poster { width:100%; height:225px; object-fit:cover; background:#27143f; }
.catalog-info { padding:12px; }
.catalog-info h3 { padding:0; margin:6px 0; font-size:16px; }
.catalog-info p { color:#d0c4e2; font-size:13px; }
.catalog-info a { display:inline-block; padding:10px; background:#9747ff; color:white; border-radius:8px; text-decoration:none; margin:4px 4px 0 0; }
.catalog-note { color:#c9b9e3; line-height:1.5; }
.movie-details { margin:10px 0; color:#ddd0f4; font-size:13px; line-height:1.5; }
.movie-details summary { cursor:pointer; color:#c39aff; font-weight:bold; }
.movie-details p { max-height:180px; overflow:auto; }
button:hover,button:focus-visible { filter: brightness(1.15); outline-offset: 3px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.card { transition: transform .2s; }
.card:hover { transform: translateY(-3px); }
.card button { min-height: 42px; }
.video-actions { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
video { background:#000; aspect-ratio:16/9; }
@media(max-width:480px) { header { padding:14px; } .logo { font-size:22px; } .hero { padding:35px 18px; } .hero h1 { font-size:28px; } section { padding:16px; } }
.hero {
  padding: 55px 20px;
  background: linear-gradient(135deg,#37115d,#100c20);
}
.hero h1 { font-size: 34px; }
section { padding: 20px; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(145px,1fr));
  gap: 15px;
}
.card {
  background: var(--card);
  border-radius: 13px;
  overflow: hidden;
  padding-bottom: 14px;
}
.poster {
  height: 175px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg,#6427aa,#201234);
  font-size: 52px;
}
.card h3 { padding: 0 12px; }
.card button { margin: 5px; }
.plan {
  padding: 22px;
  background: var(--card);
  border-radius: 12px;
}
video {
  width: 100%;
  max-width: 850px;
  border-radius: 12px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}

/* StreamPlus modern responsive interface */
header {position:sticky;top:0;z-index:20;box-shadow:0 4px 25px #0007}
nav {position:sticky;top:66px;z-index:19;scrollbar-width:thin}
.hero {min-height:300px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at 85% 20%,#7331b6 0%,transparent 45%),linear-gradient(115deg,#241039,#080711)}
.hero p {color:#e0d3ee;max-width:520px;line-height:1.6}
.hero button {font-weight:bold}
.cards {grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.card {box-shadow:0 7px 22px #0005;border:1px solid #ffffff12}
.catalog-poster {height:240px}
.catalog-info button {margin:4px 0}
.search-box {display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
.search-box input {flex:1;min-width:190px;background:#211631;color:white;border:1px solid #75529a;border-radius:10px;padding:13px;font-size:16px}
.search-box input:focus {outline:2px solid #b77aff}
.search-count {color:#c6bad8}
.player-shell {background:#130e22;border:1px solid #543078;border-radius:15px;padding:15px;margin:15px 0}
.player-shell video {width:100%;max-height:65vh;object-fit:contain}
@media(max-width:480px){nav{top:59px}.catalog-poster{height:215px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.catalog-info{padding:9px}.catalog-info a{font-size:12px}.hero{min-height:240px}}

</style>
</head>
<body>

<header>
  <div class="logo">▶ StreamPlus</div>
  <span>PROTOTYPE</span>
</header>

<nav>
  <button onclick="show('accueil')">Accueil</button>
  <button onclick="show('films')">Films</button>
  <button onclick="show('recherche')">🔎 Recherche</button>
  <button onclick="show('bollywood')">🇮🇳 Bollywood</button>
  <button onclick="show('hollywood')">🎥 Hollywood</button>
  <button onclick="show('seriespop')">📺 Séries populaires</button>
  <button onclick="show('nouveautes')">🆕 Nouveautés</button>
  <button onclick="show('populaires')">🔥 À découvrir</button>
  <button onclick="show('series')">Séries</button>
  <button onclick="show('favoris')">Ma liste</button>
  <button onclick="show('profils')">Profils</button>
  <button onclick="show('abonnements')">Abonnements</button>
</nav>

<main id="app"></main>

<footer>
  StreamPlus © 2026 — Démonstration
</footer>

<script>
const films = [
  {title:"Aventure Mystère",type:"film",emoji:"🎬"},
  {title:"Voyage Spatial",type:"film",emoji:"🚀"},
  {title:"La Dernière Mission",type:"film",emoji:"🎥"},
  {title:"Monde Fantastique",type:"film",emoji:"🌌"},
  {title:"Secrets de la Ville",type:"serie",emoji:"🌃"},
  {title:"Les Explorateurs",type:"serie",emoji:"🧭"},
  {title:"Nouvelle Génération",type:"serie",emoji:"⭐"}
];

let fav = [];
try { const saved = JSON.parse(localStorage.getItem("streamplus-fav") || "[]"); fav = Array.isArray(saved) ? saved.filter(x => Number.isInteger(x) && x >= 0 && x < films.length) : []; } catch(e) { fav = []; }
let catalogFav = {};
try { const saved=JSON.parse(localStorage.getItem("streamplus-catalog-favorites-v1")||"{}"); if(saved && typeof saved==="object" && !Array.isArray(saved)) catalogFav=saved; } catch(e) {}
function toggleCatalogFavorite(id) {
 const key=String(id);
 if(catalogFav[key]) delete catalogFav[key];
 else {
  const m=catalog.find(x=>String(x.id)===key);
  if(!m)return;
  catalogFav[key]=m;
 }
 try {localStorage.setItem("streamplus-catalog-favorites-v1",JSON.stringify(catalogFav));} catch(e) {}
 if(currentPage==="favoris") show("favoris");
 else document.querySelectorAll('[data-fav-id]').forEach(btn=>{
  if(btn.getAttribute("data-fav-id")===key) {
   const active=!!catalogFav[key];
   btn.textContent=active?"♥ Dans ma liste":"♡ Ajouter à ma liste";
   btn.setAttribute("aria-pressed",String(active));
  }
 });
}
let currentPage = "accueil";

function cards(items) {
  if (!items.length) return "<p>Aucun titre.</p>";
  return '<div class="cards">' + items.map((f) => {
    const id = films.indexOf(f);
    return `
      <div class="card">
        <div class="poster">${f.emoji}</div>
        <h3>${f.title}</h3>
        <button onclick="watch(${id})">▶ Voir</button>
        <button aria-label="Ajouter ou retirer ${f.title} de ma liste" onclick="favorite(${id})">${fav.includes(id) ? "♥ Dans ma liste" : "♡ Ma liste"}</button>
      </div>`;
  }).join("") + "</div>";
}

function show(page) {
  currentPage = page;
  let html = "";

  if (page === "accueil") {
    html = `
      <div class="hero">
        <h1>Bienvenue sur StreamPlus</h1>
        <p>Découvrez des films, des séries et des bandes-annonces. Explorez les nouveautés avec un catalogue actualisé lors de vos visites.</p>
        <button onclick="show('recherche')">🔎 Rechercher un film</button>
        <button onclick="show('films')">
          Explorer les films
        </button>
      </div>
      <section>
        <h2>🆕 Nouveaux films</h2><div id="catalog-player" hidden></div><div id="home-catalog"><p>Chargement du catalogue…</p></div>
        <button onclick="show('nouveautes')">Voir toutes les nouveautés</button>
        <h2>Films de démonstration</h2>
        ${cards(films)}
      </section>`;
  }

  if (page === "nouveautes" || page === "populaires") { renderCatalog(page); return; }
  if (page === "recherche") { renderSearch(); return; }
  if (["bollywood","hollywood","seriespop"].includes(page)) { renderGenrePage(page); return; }

  if (page === "films") {
    html = `<section><h2>Films</h2>
      ${cards(films.filter(f=>f.type==="film"))}
      </section>`;
  }

  if (page === "series") {
    html = `<section><h2>Séries</h2>
      ${cards(films.filter(f=>f.type==="serie"))}
      </section>`;
  }

  if (page === "favoris") {
    html = `<section><h2>❤️ Ma liste</h2><p class="catalog-note">Films enregistrés sur cet appareil.</p><div id="catalog-player" hidden></div><div id="saved-catalog">${renderCatalogCards(Object.values(catalogFav))}</div><h2>Films de démonstration</h2>${cards(films.filter((f,i)=>fav.includes(i)))}</section>`;
  }

  if (page === "profils") {
    html = `
      <section>
        <h2>Profils</h2>
        <div class="cards">
          <div class="plan">👤 Profil principal</div>
          <div class="plan">🧒 Profil enfant (démo)</div>
        </div>
      </section>`;
  }

  if (page === "abonnements") {
    html = `
      <section>
        <h2>Abonnements fictifs</h2>
        <div class="cards">
          <div class="plan">
            <h3>Gratuit</h3><h2>Rs 0</h2>
            <button disabled>Démo</button>
          </div>
          <div class="plan">
            <h3>Premium HD</h3>
            <h2>Rs 199/mois</h2>
            <button onclick="alert('Offre fictive')">
              Découvrir
            </button>
          </div>
          <div class="plan">
            <h3>Famille</h3>
            <h2>Rs 349/mois</h2>
            <button onclick="alert('Offre fictive')">
              Découvrir
            </button>
          </div>
        </div>
        <p>Aucun paiement réel.</p>
      </section>`;
  }

  document.getElementById("app").innerHTML = html;
  if (page === "accueil") loadCatalog().then(() => { const el=document.getElementById("home-catalog"); if(el) el.innerHTML=(catalogError?'<p class="catalog-note">'+escapeHTML(catalogError)+'</p>':"")+renderCatalogCards(catalog.slice(0,6)); });
}

function favorite(id) {
  if (fav.includes(id)) {
    fav = fav.filter(x=>x!==id);
  } else {
    fav.push(id);
  }
  localStorage.setItem("streamplus-fav",JSON.stringify(fav));
  show(currentPage);
}

function watch(id) {
  if (!films[id]) return 

show("accueil");
  currentPage = "lecteur";
  const title = films[id].title;
  document.getElementById("app").innerHTML = `
    <section>
      <h2>${title}</h2>
      <p>Extrait vidéo de démonstration avec audio. Ce n'est pas le film ou la série annoncée.</p>
      <div class="player-shell"><video id="player" controls playsinline preload="metadata">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Votre navigateur ne prend pas en charge la vidéo.
      </video></div>
      <div class="video-actions">
        <button onclick="startVideo()">▶ Lire avec le son</button>
        <button onclick="toggleMute()">🔊 Activer / couper le son</button>
        <button onclick="show('accueil')">← Accueil</button>
      </div>
      <p id="video-status" role="status">Appuyez sur Lire avec le son. Vérifiez aussi le volume multimédia du téléphone.</p>
    </section>`;
  const player = document.getElementById("player");
  player.addEventListener("playing", () => {document.getElementById("video-status").textContent="Lecture en cours. Utilisez les commandes du lecteur pour le volume et le plein écran.";});
  player.addEventListener("error", () => {
    document.getElementById("video-status").textContent = "Vidéo indisponible. Vérifiez votre connexion Internet.";
  });
}
function startVideo() {
  const v = document.getElementById("player");
  if (!v) return;
  v.muted = false;
  v.volume = 1;
  v.play().then(()=>{const status=document.getElementById("video-status");if(status)status.textContent="Lecture démarrée avec le son activé.";}).catch(() => {
    document.getElementById("video-status").textContent = "Lecture bloquée. Appuyez sur ▶ dans le lecteur.";
  });
}
function toggleMute() {
  const v = document.getElementById("player");
  if (!v) return;
  v.muted = !v.muted;
  document.getElementById("video-status").textContent = v.muted ? "Son coupé" : "Son activé. Montez le volume multimédia si nécessaire.";
}

/* Catalogue Apple Store: métadonnées renouvelées au maximum une fois par jour.
   Le classement "À découvrir" est une sélection, pas un classement de ventes. */
let catalog = [];
let catalogError = "";
const CACHE_KEY = "streamplus-catalog-v2";
function escapeHTML(s) { return String(s ?? "").replace(/[&<>"']/g, x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x])); }
async function appleSearch(term) {
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try {
    const url="https://itunes.apple.com/search?media=movie&entity=movie&country=us&limit=100&term="+encodeURIComponent(term);
    const response=await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error("Service indisponible");
    const data=await response.json();
    return Array.isArray(data.results)?data.results:[];
  } finally { clearTimeout(timer); }
}

async function loadCatalog(force=false) {
  if(catalog.length && !force) return catalog;
  try {
    const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
    if(!force && saved && Date.now()-saved.at<86400000 && Array.isArray(saved.items)) {
      catalog=saved.items; return catalog;
    }
  } catch(e) {}
  try {
    const year=new Date().getFullYear();
    const batches=await Promise.allSettled([appleSearch(String(year)),appleSearch(String(year-1)),appleSearch("Bollywood"),appleSearch("blockbuster")]);
    const unique=new Map();
    batches.forEach(b=>{ if(b.status==="fulfilled") b.value.forEach(m=>{
      if(m.kind==="feature-movie" && m.trackId && m.trackName && m.trackViewUrl && m.artworkUrl100) unique.set(m.trackId,{
        id:m.trackId,title:m.trackName,release:m.releaseDate||"",genre:m.primaryGenreName||"Film",
        poster:m.artworkUrl100,link:m.trackViewUrl,preview:m.previewUrl||"",description:m.longDescription||m.shortDescription||"",duration:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,rating:m.contentAdvisoryRating||""
      });
    }); });
    if(!unique.size) throw new Error("Aucun résultat");
    catalog=Array.from(unique.values()).sort((a,b)=>b.release.localeCompare(a.release));
    localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),items:catalog}));
    catalogError="";
  } catch(e) {
    catalogError="Actualisation impossible. Vérifiez Internet et réessayez.";
    try { const old=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); catalog=old?.items||[]; } catch(e) {}
  }
  return catalog;
}
function renderCatalogCards(items) {
  if(!items.length) return '<p>Aucun film enregistré pour le moment. Ouvrez Nouveautés et appuyez sur ♡ Ajouter à ma liste.</p>';
  return '<div class="cards">'+items.map(m=>{
    const poster=escapeHTML(m.poster.replace("100x100bb","600x900bb"));
    const link=escapeHTML(m.link);
    const preview=m.preview ? '<button onclick="playCatalogPreview('+Number(m.id)+')">▶ Voir la bande-annonce</button>' : '<span class="catalog-note">Extrait indisponible</span>';
    return '<article class="card"><img class="catalog-poster" loading="lazy" src="'+poster+'" alt="Affiche de '+escapeHTML(m.title)+'"><div class="catalog-info"><h3>'+escapeHTML(m.title)+'</h3><p>'+escapeHTML(m.release?.slice(0,4)||"Date inconnue")+' · '+escapeHTML(m.genre)+(m.duration?' · '+m.duration+' min':'')+(m.rating?' · '+escapeHTML(m.rating):'')+'</p>'+(m.description?'<details class="movie-details"><summary>Résumé du film</summary><p>'+escapeHTML(m.description)+'</p></details>':'')+'<button type="button" data-fav-id="'+Number(m.id)+'" aria-pressed="'+String(!!catalogFav[String(m.id)])+'" onclick="toggleCatalogFavorite('+Number(m.id)+')">'+(catalogFav[String(m.id)]?'♥ Dans ma liste':'♡ Ajouter à ma liste')+'</button><a href="'+link+'" target="_blank" rel="noopener noreferrer">Voir sur Apple TV</a>'+preview+'</div></article>';
  }).join("")+'</div>';
}
function playCatalogPreview(id) {
  const movie=catalog.find(m=>m.id===id)||Object.values(genreMemory).flat().find(m=>m.id===id);
  if(!movie || !movie.preview) return;
  const panel=document.getElementById("catalog-player");
  if(!panel) return;
  panel.hidden=false;
  panel.innerHTML='<div class="player-shell"><h3>'+escapeHTML(movie.title)+'</h3><p>Extrait promotionnel officiel (si disponible dans votre région).</p><video id="catalog-video" controls playsinline preload="metadata" src="'+escapeHTML(movie.preview)+'"></video><div class="video-actions"><button onclick="startCatalogVideo()">▶ Lire avec le son</button><button onclick="closeCatalogPreview()">✕ Fermer</button></div><p id="catalog-video-error" role="status"></p>';
  const v=document.getElementById("catalog-video");
  v.muted=false;
  v.addEventListener("playing",()=>{document.getElementById("catalog-video-error").textContent="Bande-annonce en lecture.";});
  v.addEventListener("error",()=>{document.getElementById("catalog-video-error").textContent="Cet extrait ne peut pas être lu ici. Essayez le lien Apple TV du film.";});
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeCatalogPreview() {
  const panel=document.getElementById("catalog-player");
  if(panel) {panel.innerHTML="";panel.hidden=true;}
}
async function renderCatalog(page,force=false) {
  const title=page==="nouveautes"?"🆕 Films récents":"🔥 Films à découvrir";
  document.getElementById("app").innerHTML='<section><h2>'+title+'</h2><p class="catalog-note">Catalogue issu de l’Apple Store, mis à jour au plus une fois par jour lors des visites. Disponibilité variable selon le pays. Les extraits sont promotionnels et les films complets ne sont pas hébergés ici.</p><button onclick="renderCatalog(\''+page+'\',true)">↻ Actualiser maintenant</button><div id="catalog-player" hidden></div><div id="catalog-results"><p>Chargement…</p></div></section>';
  await loadCatalog(force);
  if(currentPage!==page) return;
  const items=page==="nouveautes"?catalog.filter(m=>m.release && new Date(m.release)<=new Date()).slice(0,36):catalog.slice(20,56);
  document.getElementById("catalog-results").innerHTML=(catalogError?'<p role="status">'+escapeHTML(catalogError)+'</p>':'')+renderCatalogCards(items.length?items:catalog.slice(0,36));
}

function startCatalogVideo(){
 const v=document.getElementById("catalog-video");
 if(!v)return;
 v.muted=false;
 v.volume=1;
 v.play().catch(()=>{const e=document.getElementById("catalog-video-error");if(e)e.textContent="Lecture impossible ici. Utilisez ▶ dans la vidéo ou le lien Apple TV.";});
}
async function renderSearch(){
 currentPage="recherche";
 document.getElementById("app").innerHTML='<section><h2>🔎 Rechercher des films</h2><p class="catalog-note">Recherche dans le catalogue disponible. Les films complets ne sont pas hébergés sur StreamPlus.</p><div class="search-box"><input id="movie-search" type="search" placeholder="Titre, genre, année…" aria-label="Rechercher des films"><button onclick="filterMovies()">Rechercher</button></div><p class="search-count" id="search-count" role="status">Chargement…</p><div id="catalog-player" hidden></div><div id="search-results"></div></section>';
 const input=document.getElementById("movie-search");
 input.addEventListener("input",filterMovies);
 await loadCatalog();
 if(currentPage!=="recherche")return;
 filterMovies();
}
function filterMovies(){
 const input=document.getElementById("movie-search");
 const target=document.getElementById("search-results");
 if(!input||!target)return;
 const q=input.value.trim().toLocaleLowerCase();
 const found=catalog.filter(m=>[m.title,m.genre,m.release?.slice(0,4)].some(v=>String(v||"").toLocaleLowerCase().includes(q)));
 document.getElementById("search-count").textContent=found.length+" film(s) trouvé(s)"+(catalogError?" — catalogue en cache ou indisponible":"");
 target.innerHTML=renderCatalogCards(found.slice(0,60));
}

const GENRE_CACHE="streamplus-genres-v1";
const genreMemory={};
async function fetchGenreItems(page,force=false){
 const saved=(()=>{try{return JSON.parse(localStorage.getItem(GENRE_CACHE)||"{}")}catch(e){return {}}})();
 if(!force&&saved[page]&&Date.now()-saved[page].at<86400000)return saved[page].items;
 const config={
  bollywood:{terms:["Bollywood","Hindi cinema","Shah Rukh Khan"],media:"movie",entity:"movie"},
  hollywood:{terms:["Hollywood","action movie","science fiction"],media:"movie",entity:"movie"},
  seriespop:{terms:["drama","comedy","thriller"],media:"tvShow",entity:"tvSeason"}
 }[page];
 const requests=config.terms.map(term=>fetch("https://itunes.apple.com/search?country=us&limit=70&media="+config.media+"&entity="+config.entity+"&term="+encodeURIComponent(term)).then(r=>{if(!r.ok)throw Error("API");return r.json()}));
 const batches=await Promise.allSettled(requests);
 const unique=new Map();
 for(const b of batches){
  if(b.status!=="fulfilled")continue;
  for(const m of (b.value.results||[])){
   const id=m.trackId||m.collectionId;
   const title=m.trackName||m.collectionName;
   const link=m.trackViewUrl||m.collectionViewUrl;
   if(!id||!title||!link||!m.artworkUrl100)continue;
   if(config.media==="movie"&&m.kind!=="feature-movie")continue;
   unique.set(id,{id,title,release:m.releaseDate||"",genre:m.primaryGenreName||"Série",poster:m.artworkUrl100,link,preview:m.previewUrl||"",description:m.longDescription||m.shortDescription||"",duration:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,rating:m.contentAdvisoryRating||""});
  }
 }
 const items=[...unique.values()].sort((a,b)=>b.release.localeCompare(a.release));
 if(items.length){saved[page]={at:Date.now(),items};try{localStorage.setItem(GENRE_CACHE,JSON.stringify(saved))}catch(e){}return items;}
 return saved[page]?.items||[];
}
async function renderGenrePage(page,force=false){
 currentPage=page;
 const names={bollywood:"🇮🇳 Films Bollywood",hollywood:"🎥 Films Hollywood",seriespop:"📺 Séries à découvrir"};
 document.getElementById("app").innerHTML='<section><h2>'+names[page]+'</h2><p class="catalog-note">Sélection de résultats Apple Store. Les catégories sont indicatives, et les bandes-annonces ne sont pas toujours disponibles.</p><button onclick="renderGenrePage(\''+page+'\',true)">↻ Actualiser</button><div id="catalog-player" hidden></div><div id="genre-results" role="status">Chargement…</div></section>';
 try{
  const items=await fetchGenreItems(page,force);
  if(currentPage!==page)return;
  genreMemory[page]=items;
  const target=document.getElementById("genre-results");
  if(!target)return;
  target.innerHTML=items.length?renderCatalogCards(items.slice(0,48)):'<p>Aucun résultat disponible. Réessayez plus tard.</p>';
 }catch(e){const target=document.getElementById("genre-results");if(target)target.textContent="Catalogue temporairement indisponible. Réessayez.";}
}

show("accueil");
</script>
</body>
</html>
