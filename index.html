<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#130e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>StreamPlus</title>
<style>
:root {
  --bg: #090711;
  --card: #1c1630;
  --purple: #9747ff;
  --muted: #c6bad8;
  --text: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  background: #130e22;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  color: #b77aff;
  font-size: 26px;
  font-weight: bold;
}
nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
  background: #130e22;
}
button {
  background: var(--purple);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  cursor: pointer;
}
nav button { white-space: nowrap; }
.catalog-poster { width:100%; height:225px; object-fit:cover; background:#27143f; }
.catalog-info { padding:12px; }
.catalog-info h3 { padding:0; margin:6px 0; font-size:16px; }
.catalog-info p { color:#d0c4e2; font-size:13px; }
.catalog-info a { display:inline-block; padding:10px; background:#9747ff; color:white; border-radius:8px; text-decoration:none; margin:4px 4px 0 0; }
.catalog-note { color:#c9b9e3; line-height:1.5; }
.movie-details { margin:10px 0; color:#ddd0f4; font-size:13px; line-height:1.5; }
.movie-details summary { cursor:pointer; color:#c39aff; font-weight:bold; }
.movie-details p { max-height:180px; overflow:auto; }
button:hover,button:focus-visible { filter: brightness(1.15); outline-offset: 3px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.card { transition: transform .2s; }
.card:hover { transform: translateY(-3px); }
.card button { min-height: 42px; }
.video-actions { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
video { background:#000; aspect-ratio:16/9; }
@media(max-width:480px) { header { padding:14px; } .logo { font-size:22px; } .hero { padding:35px 18px; } .hero h1 { font-size:28px; } section { padding:16px; } }
.hero {
  padding: 55px 20px;
  background: linear-gradient(135deg,#37115d,#100c20);
}
.hero h1 { font-size: 34px; }
section { padding: 20px; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(145px,1fr));
  gap: 15px;
}
.card {
  background: var(--card);
  border-radius: 13px;
  overflow: hidden;
  padding-bottom: 14px;
}
.poster {
  height: 175px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg,#6427aa,#201234);
  font-size: 52px;
}
.card h3 { padding: 0 12px; }
.card button { margin: 5px; }
.plan {
  padding: 22px;
  background: var(--card);
  border-radius: 12px;
}
video {
  width: 100%;
  max-width: 850px;
  border-radius: 12px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}

/* StreamPlus modern responsive interface */
header {position:sticky;top:0;z-index:20;box-shadow:0 4px 25px #0007}
nav {position:sticky;top:66px;z-index:19;scrollbar-width:thin}

.hero p {color:#e0d3ee;max-width:520px;line-height:1.6}
.hero button {font-weight:bold}
.cards {grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.card {box-shadow:0 7px 22px #0005;border:1px solid #ffffff12}
.catalog-poster {height:240px}
.catalog-info button {margin:4px 0}
.search-box {display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
.search-box input {flex:1;min-width:190px;background:#211631;color:white;border:1px solid #75529a;border-radius:10px;padding:13px;font-size:16px}

@media(max-width:480px){nav{top:59px}.catalog-poster{height:215px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.catalog-info{padding:9px}.catalog-info a{font-size:12px}
.catalog-info button,.catalog-info a{background:#7836c7!important;color:#fff!important;border:1px solid #a56ae9!important;display:inline-flex;align-items:center;justify-content:center;min-height:39px;text-align:center;line-height:1.25;font-weight:700;text-decoration:none;border-radius:9px}
.catalog-info button:hover,.catalog-info a:hover{background:#9b54ec!important}
.catalog-info .trailer-link{background:#26173c!important}
.catalog-poster{object-fit:cover;aspect-ratio:2/3;height:auto;min-height:210px}
.catalog-info{display:flex;flex-direction:column;gap:6px}

/* StreamPlus V2 */
.version-tag{font-size:11px;letter-spacing:1.2px;color:#d8baff;border:1px solid #67429a;padding:8px 10px;border-radius:30px}
nav button{background:transparent;border:1px solid transparent;color:#e5daf3;font-weight:600}

.hero-copy{max-width:650px;position:relative;z-index:1}

</style>
</head>
<body>

<header>
  <div class="logo">▶ StreamPlus</div>
  <button id="install-app" type="button" hidden>⬇ Install App</button><span class="version-tag">V2 · PREVIEW</span>
</header>

<nav>
  <button onclick="show('accueil')">Home</button>
  <button onclick="show('films')">Movies</button>
  <button onclick="show('recherche')">🔎 Search</button>
  <button onclick="show('bollywood')">🇮🇳 Bollywood</button>
  <button onclick="show('hollywood')">🎥 Hollywood</button>
  <button onclick="show('seriespop')">📺 Popular Series</button>
  <button onclick="show('nouveautes')">🆕 New Releases</button>
  <button onclick="show('populaires')">🔥 Trending Picks</button>
  <button onclick="show('series')">Series</button>
  <button onclick="show('favoris')">My List</button>
  <button onclick="show('profils')">Profiles</button>
  <button onclick="show('abonnements')">Subscriptions</button>
</nav>

<main id="app"></main>

<footer>
  StreamPlus © 2026 — Preview · Legal trailers only
</footer>

<script>
const films = [
  {title:"Aventure Mystère",type:"film",emoji:"🎬"},
  {title:"Voyage Spatial",type:"film",emoji:"🚀"},
  {title:"La Dernière Mission",type:"film",emoji:"🎥"},
  {title:"Monde Fantastique",type:"film",emoji:"🌌"},
  {title:"Secrets de la Ville",type:"serie",emoji:"🌃"},
  {title:"Les Explorateurs",type:"serie",emoji:"🧭"},
  {title:"Nouvelle Génération",type:"serie",emoji:"⭐"}
];

let fav = [];
try { const saved = JSON.parse(localStorage.getItem("streamplus-fav") || "[]"); fav = Array.isArray(saved) ? saved.filter(x => Number.isInteger(x) && x >= 0 && x < films.length) : []; } catch(e) { fav = []; }
let catalogFav = {};
try { const saved=JSON.parse(localStorage.getItem("streamplus-catalog-favorites-v1")||"{}"); if(saved && typeof saved==="object" && !Array.isArray(saved)) catalogFav=saved; } catch(e) {}
function toggleCatalogFavorite(id) {
 const key=String(id);
 if(catalogFav[key]) delete catalogFav[key];
 else {
  const m=catalog.find(x=>String(x.id)===key)||Object.values(genreMemory).flat().find(x=>String(x.id)===key);
  if(!m)return;
  catalogFav[key]=m;
 }
 try {localStorage.setItem("streamplus-catalog-favorites-v1",JSON.stringify(catalogFav));} catch(e) {}
 if(currentPage==="favoris") show("favoris");
 else document.querySelectorAll('[data-fav-id]').forEach(btn=>{
  if(btn.getAttribute("data-fav-id")===key) {
   const active=!!catalogFav[key];
   btn.textContent=active?"♥ In My List":"♡ Add to My List";
   btn.setAttribute("aria-pressed",String(active));
  }
 });
}
let currentPage = "accueil";

function cards(items) {
  if (!items.length) return "<p>No titles found.</p>";
  return '<div class="cards">' + items.map((f) => {
    const id = films.indexOf(f);
    return `
      <div class="card">
        <div class="poster">${f.emoji}</div>
        <h3>${f.title}</h3>
        <button onclick="watch(${id})">▶ Play Demo</button>
        <button aria-label="Ajouter ou retirer ${f.title} de ma liste" onclick="favorite(${id})">${fav.includes(id) ? "♥ In My List" : "♡ My List"}</button>
      </div>`;
  }).join("") + "</div>";
}

function show(page) {
  currentPage = page;
  let html = "";

  if (page === "accueil") {
    html = `
      <div class="hero hero-v2">
        <div class="hero-copy"><span class="eyebrow">STREAMPLUS ORIGINAL EXPERIENCE · V2</span><h1>Your next movie night starts here.</h1>
        <p>Explore new releases, curated movie picks and official trailers. Save favorites in My List.</p>
        <div class="hero-buttons"><button onclick="show('nouveautes')">▶ Explore New Releases</button><button class="secondary" onclick="show('recherche')">🔎 Search Movies</button></div></div>
        <div id="hero-art" aria-hidden="true">🎬</div>
      </div>
      <section class="home-sections"><div id="catalog-player" hidden></div>
        <div class="section-heading"><h2>🆕 Latest Releases</h2><button class="text-button" onclick="show('nouveautes')">See All →</button></div><div id="home-catalog"><p>Loading movies…</p></div>
        <div class="section-heading"><h2>🔥 Trending Picks</h2><button class="text-button" onclick="show('populaires')">Explore →</button></div><div id="home-trending"><p>Loading picks…</p></div>
        <div class="section-heading"><h2>❤️ My List</h2><button class="text-button" onclick="show('favoris')">View My List →</button></div><div id="home-favorites"></div>
      </section>`;
  }

  if (page === "nouveautes" || page === "populaires") { renderCatalog(page); return; }
  if (page === "recherche") { renderSearch(); return; }
  if (["bollywood","hollywood","seriespop"].includes(page)) { renderGenrePage(page); return; }

  if (page === "films") {
    html = `<section><h2>Movies</h2>
      ${cards(films.filter(f=>f.type==="film"))}
      </section>`;
  }

  if (page === "series") {
    html = `<section><h2>Series</h2>
      ${cards(films.filter(f=>f.type==="serie"))}
      </section>`;
  }

  if (page === "favoris") {
    html = `<section><h2>❤️ My List</h2><p class="catalog-note">Movies saved on this device.</p><div id="catalog-player" hidden></div><div id="saved-catalog">${renderCatalogCards(Object.values(catalogFav))}</div><h2>Demo Movies</h2>${cards(films.filter((f,i)=>fav.includes(i)))}</section>`;
  }

  if (page === "profils") {
    html = `
      <section>
        <h2>Profiles</h2>
        <div class="cards">
          <div class="plan">👤 Main Profile</div>
          <div class="plan">🧒 Kids Profile (demo)</div>
        </div>
      </section>`;
  }

  if (page === "abonnements") {
    html = `
      <section>
        <h2>Demo Subscription Plans</h2>
        <div class="cards">
          <div class="plan">
            <h3>Free</h3><h2>Rs 0</h2>
            <button disabled>Démo</button>
          </div>
          <div class="plan">
            <h3>Premium HD</h3>
            <h2>Rs 199/mois</h2>
            <button onclick="alert('Offre fictive')">
              Explore
            </button>
          </div>
          <div class="plan">
            <h3>Family</h3>
            <h2>Rs 349/mois</h2>
            <button onclick="alert('Offre fictive')">
              Explore
            </button>
          </div>
        </div>
        <p>No real payments.</p>
      </section>`;
  }

  document.getElementById("app").innerHTML = html;
  if (page === "accueil") {
    const favBox=document.getElementById("home-favorites");
    if(favBox)favBox.innerHTML=Object.keys(catalogFav).length?renderCatalogCards(Object.values(catalogFav).slice(0,6)):'<p class="catalog-note">Your saved movies will appear here. Browse New Releases to add favorites.</p>';
    loadCatalog().then(()=>{
      if(currentPage!=="accueil")return;
      const latest=document.getElementById("home-catalog"),trending=document.getElementById("home-trending");
      if(latest)latest.innerHTML=(catalogError?'<p class="catalog-note">'+escapeHTML(catalogError)+'</p>':"")+renderCatalogCards(catalog.filter(m=>!m.release||new Date(m.release)<=new Date()).slice(0,8));
      if(trending)trending.innerHTML=renderCatalogCards(catalog.length<=20?catalog.slice(4,12):catalog.slice(20,28));
    });
  }
}

function favorite(id) {
  if (fav.includes(id)) {
    fav = fav.filter(x=>x!==id);
  } else {
    fav.push(id);
  }
  localStorage.setItem("streamplus-fav",JSON.stringify(fav));
  show(currentPage);
}

function watch(id) {
  if (!films[id]) return show("accueil");
  currentPage = "lecteur";
  const title = films[id].title;
  document.getElementById("app").innerHTML = `
    <section>
      <h2>${title}</h2>
      <p>Sample video with sound. This is not the advertised movie or series.</p>
      <div class="player-shell"><video id="player" controls playsinline preload="metadata">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video></div>
      <div class="video-actions">
        <button onclick="startVideo()">▶ Play with Sound</button>
        <button onclick="toggleMute()">🔊 Toggle Sound</button>
        <button onclick="show('accueil')">← Home</button>
      </div>
      <p id="video-status" role="status">Tap Play with Sound. Check your device media volume.</p>
    </section>`;
  const player = document.getElementById("player");
  player.addEventListener("playing", () => {document.getElementById("video-status").textContent="Playing. Use the player controls for volume and full screen.";});
  player.addEventListener("error", () => {
    document.getElementById("video-status").textContent = "Video unavailable. Check your internet connection.";
  });
}
function startVideo() {
  const v = document.getElementById("player");
  if (!v) return;
  v.muted = false;
  v.volume = 1;
  v.play().then(()=>{const status=document.getElementById("video-status");if(status)status.textContent="Playback started with sound enabled.";}).catch(() => {
    document.getElementById("video-status").textContent = "Playback blocked. Tap ▶ on the player.";
  });
}
function toggleMute() {
  const v = document.getElementById("player");
  if (!v) return;
  v.muted = !v.muted;
  document.getElementById("video-status").textContent = v.muted ? "Sound off" : "Sound on. Increase your device media volume if needed.";
}

/* Catalogue Apple Store: métadonnées renouvelées au maximum une fois par jour.
   Le classement "À découvrir" est une sélection, pas un classement de ventes. */
// Built-in offline-safe discovery selection. These are real film titles, not live listings.
const FALLBACK_TITLES=[
 ["Dune: Part Two",2024,"Science Fiction"],["Inside Out 2",2024,"Animation"],["Wicked",2024,"Musical"],["The Wild Robot",2024,"Animation"],["Deadpool & Wolverine",2024,"Action"],["Moana 2",2024,"Animation"],["Gladiator II",2024,"Action"],["Furiosa: A Mad Max Saga",2024,"Action"],["The Substance",2024,"Horror"],["A Quiet Place: Day One",2024,"Thriller"],["Kung Fu Panda 4",2024,"Animation"],["Beetlejuice Beetlejuice",2024,"Comedy"]
];
function fallbackPoster(title){
 const lines=title.length>19?[title.slice(0,19),title.slice(19,38)]:[title];
 const colors=["#7b3ce1","#3a59c7","#bb3a93","#177e9c","#a43f60","#6846b3"];
 const accent=colors[FALLBACK_TITLES.findIndex(x=>x[0]===title)%colors.length]||"#9747ff";
 const safe=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+accent+'"/><stop offset="1" stop-color="#100a21"/></linearGradient></defs><rect width="400" height="600" fill="url(#g)"/><circle cx="310" cy="155" r="160" fill="#ffffff" opacity=".07"/><path d="M0 400L400 200V600H0Z" fill="#000" opacity=".28"/><text x="200" y="235" text-anchor="middle" font-size="105" fill="#ffffff" opacity=".9">▶</text>'+lines.map((line,i)=>'<text x="200" y="'+(390+i*39)+'" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="27" fill="white">'+safe(line)+'</text>').join("")+'<text x="200" y="555" text-anchor="middle" font-family="Arial" font-size="17" letter-spacing="2" fill="#e6d5ff">STREAMPLUS PICK</text></svg>';
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function trailerSearchUrl(title,year){
 return "https://www.youtube.com/results?search_query="+encodeURIComponent(title+" "+(year||"")+" official trailer");
}

const FALLBACK_CATALOG=FALLBACK_TITLES.map(([title,year,genre],index)=>({
 id:-(index+1),title,release:year+"-01-01",genre,poster:fallbackPoster(title),
 link:"https://tv.apple.com/search?term="+encodeURIComponent(title),preview:"",trailerLink:trailerSearchUrl(title,year),
 description:"Curated discovery title. Open Apple TV to check availability in your region.",
 fallback:true
}));

let catalog = [];
let catalogError = "";
const CACHE_KEY = "streamplus-catalog-v3";
const LEGACY_CACHE_KEY = "streamplus-catalog-v2";
function escapeHTML(s) { return String(s ?? "").replace(/[&<>"']/g, x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x])); }
async function appleSearch(term) {
 const url="https://itunes.apple.com/search?media=movie&entity=movie&country=us&limit=100&term="+encodeURIComponent(term);
 try {
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),9000);
  try {const response=await fetch(url,{signal:controller.signal,cache:"no-store"});if(!response.ok)throw Error("API error");const data=await response.json();return Array.isArray(data.results)?data.results:[];}
  finally {clearTimeout(timer);}
 }catch(fetchError){
  return new Promise((resolve,reject)=>{
   const callback="streamplusJSONP_"+Math.random().toString(36).slice(2);
   const script=document.createElement("script");
   const timer=setTimeout(()=>finish(null),10000);
   function finish(data){clearTimeout(timer);delete window[callback];script.remove();if(data&&Array.isArray(data.results))resolve(data.results);else reject(fetchError);}
   window[callback]=finish;
   script.onerror=()=>finish(null);
   script.src=url+"&callback="+callback;
   document.head.appendChild(script);
  });
 }
}
async function loadPublishedCatalog(){
 try {
  const response=await fetch("./catalog.json?version="+Math.floor(Date.now()/3600000),{cache:"no-store"});
  if(!response.ok) return [];
  const data=await response.json();
  return Array.isArray(data.items)?data.items.filter(m=>m.id&&m.title&&m.poster&&m.link):[];
 }catch(e){return [];}
}
async function loadCatalog(force=false) {
  if(catalog.length && !force) return catalog;
  const published=await loadPublishedCatalog();
  if(published.length){catalog=published;catalogError="";return catalog;}
  try {
    const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
    if(!force && saved && Date.now()-saved.at<86400000 && Array.isArray(saved.items)) {
      catalog=saved.items; return catalog;
    }
  } catch(e) {}
  try {
    const year=new Date().getFullYear();
    const batches=await Promise.allSettled([appleSearch(String(year)),appleSearch(String(year-1)),appleSearch("Bollywood"),appleSearch("blockbuster")]);
    const unique=new Map();
    batches.forEach(b=>{ if(b.status==="fulfilled") b.value.forEach(m=>{
      if(m.kind==="feature-movie" && m.trackId && m.trackName && m.trackViewUrl && m.artworkUrl100) unique.set(m.trackId,{
        id:m.trackId,title:m.trackName,release:m.releaseDate||"",genre:m.primaryGenreName||"Film",
        poster:m.artworkUrl100,link:m.trackViewUrl,preview:m.previewUrl||"",description:m.longDescription||m.shortDescription||"",duration:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,rating:m.contentAdvisoryRating||""
      });
    }); });
    if(!unique.size) throw new Error("Aucun résultat");
    catalog=Array.from(unique.values()).sort((a,b)=>b.release.localeCompare(a.release));
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),items:catalog}));}catch(storageError){}
    catalogError="";
  } catch(e) {
    catalogError="Unable to refresh movies. Check your internet connection and tap Refresh Now.";
    try { const old=JSON.parse(localStorage.getItem(CACHE_KEY)||localStorage.getItem(LEGACY_CACHE_KEY)||"null"); catalog=old?.items||[]; } catch(e) {}
    if(!catalog.length){catalog=FALLBACK_CATALOG;catalogError="Showing built-in movie picks. Live listings are temporarily unavailable; use Refresh Now to retry.";}
  }
  return catalog;
}
function renderCatalogCards(items) {
  if(!items.length) return '<p class="catalog-note">No movies here yet. Browse New Releases or try refreshing.</p>';
  return '<div class="cards">'+items.map(m=>{
    const poster=escapeHTML(String(m.poster||"").replace("100x100bb","600x900bb"));
    const link=escapeHTML(m.link);
    const preview=m.preview ? '<button class="trailer-button" onclick="playCatalogPreview('+Number(m.id)+')">▶ Watch Trailer</button>' : '<a class="trailer-link" href="'+escapeHTML(m.trailerLink||trailerSearchUrl(m.title,m.release?.slice(0,4)))+'" target="_blank" rel="noopener noreferrer">▶ Search Official Trailer</a>';
    return '<article class="card"><img class="catalog-poster" loading="lazy" src="'+poster+'" alt="Artwork for '+escapeHTML(m.title)+'"><div class="catalog-info"><h3>'+escapeHTML(m.title)+'</h3><p>'+escapeHTML(m.release?.slice(0,4)||"Unknown date")+' · '+escapeHTML(m.genre)+(m.duration?' · '+m.duration+' min':'')+(m.rating?' · '+escapeHTML(m.rating):'')+'</p>'+(m.description?'<details class="movie-details"><summary>Movie Overview</summary><p>'+escapeHTML(m.description)+'</p></details>':'')+'<button type="button" data-fav-id="'+Number(m.id)+'" aria-pressed="'+String(!!catalogFav[String(m.id)])+'" onclick="toggleCatalogFavorite('+Number(m.id)+')">'+(catalogFav[String(m.id)]?'♥ In My List':'♡ Add to My List')+'</button><a href="'+link+'" target="_blank" rel="noopener noreferrer">'+(m.fallback?"Search Apple TV":"View on Apple TV")+"</a>"+preview+'</div></article>';
  }).join("")+'</div>';
}
function playCatalogPreview(id) {
  const movie=catalog.find(m=>String(m.id)===String(id))||Object.values(genreMemory).flat().find(m=>String(m.id)===String(id))||catalogFav[String(id)];
  if(!movie || !movie.preview) return;
  const panel=document.getElementById("catalog-player");
  if(!panel) return;
  panel.hidden=false;
  panel.innerHTML='<div class="player-shell"><h3>'+escapeHTML(movie.title)+'</h3><p>Official promotional preview (availability varies by region).</p><video id="catalog-video" controls playsinline preload="metadata" src="'+escapeHTML(movie.preview)+'"></video><div class="video-actions"><button onclick="startCatalogVideo()">▶ Play with Sound</button><button onclick="closeCatalogPreview()">✕ Close</button></div><p id="catalog-video-error" role="status"></p>';
  const v=document.getElementById("catalog-video");
  v.muted=false;
  v.addEventListener("playing",()=>{document.getElementById("catalog-video-error").textContent="Trailer playing.";});
  v.addEventListener("error",()=>{document.getElementById("catalog-video-error").textContent="This trailer cannot play here. Try the Apple TV link.";});
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeCatalogPreview() {
  const panel=document.getElementById("catalog-player");
  if(panel) {panel.innerHTML="";panel.hidden=true;}
}
async function renderCatalog(page,force=false) {
  const title=page==="nouveautes"?"🆕 Latest Releases":"🔥 Trending Picks";
  document.getElementById("app").innerHTML='<section><h2>'+title+'</h2><p class="catalog-note">Movie discovery via Apple Store listings, refreshed when visited (up to once daily). Trending Picks are curated selections, not verified popularity rankings. Trailer availability varies by region. No full movies are hosted here.</p><button onclick="renderCatalog(\''+page+'\',true)">↻ Refresh Now</button><div id="catalog-player" hidden></div><div id="catalog-results"><p>Loading…</p></div></section>';
  await loadCatalog(force);
  if(currentPage!==page) return;
  const items=page==="nouveautes"?catalog.filter(m=>m.release && new Date(m.release)<=new Date()).slice(0,36):(catalog.length<=20?catalog.slice(0,36):catalog.slice(20,56));
  document.getElementById("catalog-results").innerHTML=(catalogError?'<p role="status">'+escapeHTML(catalogError)+'</p>':'')+renderCatalogCards(items.length?items:catalog.slice(0,36));
}

function startCatalogVideo(){
 const v=document.getElementById("catalog-video");
 if(!v)return;
 v.muted=false;
 v.volume=1;
 v.play().catch(()=>{const e=document.getElementById("catalog-video-error");if(e)e.textContent="Playback unavailable here. Tap ▶ in the video or use the Apple TV link.";});
}
async function renderSearch(){
 currentPage="recherche";
 document.getElementById("app").innerHTML='<section><h2>🔎 Search Movies</h2><p class="catalog-note">Search available catalog titles. Full movies are not hosted on StreamPlus.</p><div class="search-box"><input id="movie-search" type="search" placeholder="Title, genre, year…" aria-label="Search Movies"><button onclick="filterMovies()">Search</button></div><p class="search-count" id="search-count" role="status">Loading…</p><div id="catalog-player" hidden></div><div id="search-results"></div></section>';
 const input=document.getElementById("movie-search");
 input.addEventListener("input",filterMovies);
 await loadCatalog();
 if(currentPage!=="recherche")return;
 filterMovies();
}
function filterMovies(){
 const input=document.getElementById("movie-search");
 const target=document.getElementById("search-results");
 if(!input||!target)return;
 const q=input.value.trim().toLocaleLowerCase();
 const found=catalog.filter(m=>[m.title,m.genre,m.release?.slice(0,4)].some(v=>String(v||"").toLocaleLowerCase().includes(q)));
 document.getElementById("search-count").textContent=found.length+" movie(s) found"+(catalogError?" — cached catalog or temporarily unavailable":"");
 target.innerHTML=renderCatalogCards(found.slice(0,60));
}

const GENRE_CACHE="streamplus-genres-v1";
const genreMemory={};
async function fetchGenreItems(page,force=false){
 const saved=(()=>{try{return JSON.parse(localStorage.getItem(GENRE_CACHE)||"{}")}catch(e){return {}}})();
 if(!force&&saved[page]&&Date.now()-saved[page].at<86400000)return saved[page].items;
 const config={
  bollywood:{terms:["Bollywood","Hindi cinema","Shah Rukh Khan"],media:"movie",entity:"movie"},
  hollywood:{terms:["Hollywood","action movie","science fiction"],media:"movie",entity:"movie"},
  seriespop:{terms:["drama","comedy","thriller"],media:"tvShow",entity:"tvSeason"}
 }[page];
 const requests=config.terms.map(term=>fetch("https://itunes.apple.com/search?country=us&limit=70&media="+config.media+"&entity="+config.entity+"&term="+encodeURIComponent(term)).then(r=>{if(!r.ok)throw Error("API");return r.json()}));
 const batches=await Promise.allSettled(requests);
 const unique=new Map();
 for(const b of batches){
  if(b.status!=="fulfilled")continue;
  for(const m of (b.value.results||[])){
   const id=m.trackId||m.collectionId;
   const title=m.trackName||m.collectionName;
   const link=m.trackViewUrl||m.collectionViewUrl;
   if(!id||!title||!link||!m.artworkUrl100)continue;
   if(config.media==="movie"&&m.kind!=="feature-movie")continue;
   unique.set(id,{id,title,release:m.releaseDate||"",genre:m.primaryGenreName||"Series",poster:m.artworkUrl100,link,preview:m.previewUrl||"",description:m.longDescription||m.shortDescription||"",duration:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,rating:m.contentAdvisoryRating||""});
  }
 }
 const items=[...unique.values()].sort((a,b)=>b.release.localeCompare(a.release));
 if(items.length){saved[page]={at:Date.now(),items};try{localStorage.setItem(GENRE_CACHE,JSON.stringify(saved))}catch(e){}return items;}
 return saved[page]?.items||[];
}
async function renderGenrePage(page,force=false){
 currentPage=page;
 const names={bollywood:"🇮🇳 Bollywood Movies",hollywood:"🎥 Hollywood Movies",seriespop:"📺 Popular Series Picks"};
 document.getElementById("app").innerHTML='<section><h2>'+names[page]+'</h2><p class="catalog-note">Apple Store discovery results. Categories are approximate and trailers may be unavailable.</p><button onclick="renderGenrePage(\''+page+'\',true)">↻ Refresh</button><div id="catalog-player" hidden></div><div id="genre-results" role="status">Loading…</div></section>';
 try{
  const items=await fetchGenreItems(page,force);
  if(currentPage!==page)return;
  genreMemory[page]=items;
  const target=document.getElementById("genre-results");
  if(!target)return;
  target.innerHTML=items.length?renderCatalogCards(items.slice(0,48)):'<p>No results available. Try again later.</p>';
 }catch(e){const target=document.getElementById("genre-results");if(target)target.textContent="Catalog temporarily unavailable. Please retry.";}
}

window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;const button=document.getElementById("install-app");if(button)button.hidden=false;});
document.getElementById("install-app").addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("install-app").hidden=true;});
window.addEventListener("appinstalled",()=>{document.getElementById("install-app").hidden=true;installPrompt=null;});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
show("accueil");
