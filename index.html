</html lang='fr'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>StreamPlus — Démo</title><style>body{margin:0;background:#0b0918;color:white;font-family:system-ui}header{padding:24px;background:#171126;display:flex;justify-content:space-between;align-items:center}h1{color:#b28cff}main{max-width:1100px;margin:auto;padding:25px}.hero{padding:55px 25px;background:linear-gradient(120deg,#391b6d,#100b20);border-radius:20px}button{background:#823ef0;color:white;border:0;border-radius:9px;padding:13px;margin:5px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}.card{background:#211832;border-radius:12px;padding:24px;min-height:120px}nav button{background:transparent}input{padding:12px;border-radius:8px;border:0}small{color:#b7abc9}</style><header><h1>▶ StreamPlus</h1><nav><button onclick="show('accueil')">Accueil</button><button onclick="show('films')">Films</button><button onclick="show('series')">Séries</button><button onclick="show('profils')">Profils</button><button onclick="show('premium')">Premium</button></nav></header><main id='app'></main><script>const films=['Mission Maurice','L’île mystérieuse','Dernière frontière','Le secret du lagon'],series=['Chroniques de Port-Louis','Horizons','Les gardiens'];let fav=JSON.parse(localStorage.getItem('streamplus-fav')||'[]');function cards(a){return '<div class="cards">'+a.map(t=>'<div class="card"><h3>'+t+'</h3><small>Contenu fictif de démonstration</small><p><button onclick="watch(\''+t+'\')">▶ Regarder</button><button onclick="favorite(\''+t+'\')">♡</button></p></div>').join('')+'</div>'}function show(s){let html=s==='accueil'?'<div class="hero"><h2>Votre cinéma, partout.</h2><p>Découvrez StreamPlus — films et séries de démonstration.</p><button onclick="show(\'films\')">Explorer les films</button></div><h2>Tendances</h2>'+cards(films.slice(0,3)):s==='films'?'<h2>Films</h2>'+cards(films):s==='series'?'<h2>Séries</h2>'+cards(series):s==='profils'?'<h2>Profils</h2><button onclick="alert(\'Profil Démo sélectionné\')">Profil Démo</button><h3>Ma liste</h3>'+cards(fav):'<h2>Abonnements fictifs</h2><div class="cards"><div class="card">Gratuit — Rs 0</div><div class="card">Premium HD — Rs 199/mois</div><div class="card">Famille — Rs 349/mois</div></div><p>Aucun paiement réel.</p>';document.getElementById('app').innerHTML=html+'<p><small>Prototype uniquement. Aucun film commercial n’est diffusé.</small></p>'}function favorite(t){if(!fav.includes(t))fav.push(t);else fav=fav.filter(x=>x!==t);localStorage.setItem('streamplus-fav',JSON.stringify(fav));alert('Liste mise à jour')}function watch(t){document.getElementById('app').innerHTML='<h2>'+t+'</h2><p>Vidéo de démonstration librement accessible.</p><video controls width="100%" style="max-width:850px" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video><p><button onclick="show(\'accueil\')">Retour</button></p>'}show('accueil')</script>
</html>
